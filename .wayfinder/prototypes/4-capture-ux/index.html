<title>Capture UX — voice todo prototype</title>

  Question: what does voice capture feel like on the phone, and — the real decision —
  confirm-before-save vs auto-save?
  Three structurally different variants, switch via ?variant=A|B|C or the bottom bar / arrow keys.
  The "simulate" tray fires the scripted Gemini branches from the intent contract (ticket #2):
  capture(2 todos) · command hit(1 high) · command ambiguous(tap-list) · transcription fail · unknown.
  Command completion is NEVER auto-applied in any variant (per #2). The variants disagree only about CAPTURE.
-->

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const VARIANTS = {
    A: { name: "Confirm sheet", tag: "deliberate — nothing lands unseen" },
    B: { name: "Auto-save + undo", tag: "fast — trust the model, undo if wrong" },
    C: { name: "Pending review", tag: "hybrid — lands as draft, self-confirms" },
  };
  const ORDER = ["A", "B", "C"];

  const SEED = () => ([
    { id: "t1", title: "Buy milk", due: "Today", done: false },
    { id: "t2", title: "Renew car insurance", due: "Jul 28", done: false },
    { id: "t3", title: "Call the dentist", due: null, done: false },
    { id: "t4", title: "Reply to Sam about the trip", due: "Tomorrow", done: false },
  ]);

  // scripted Gemini responses (shape per intent-contract ticket #2)
  const SIM = {
    capture: { intent: "capture", transcript: "buy milk and call the dentist tomorrow",
      captures: [ { title: "Buy milk", due: "Today" }, { title: "Call the dentist", due: "Tomorrow" } ] },
    capture1: { intent: "capture", transcript: "pick up a birthday card for mum",
      captures: [ { title: "Pick up a birthday card for mum", due: null } ] },
    "cmd-hit": { intent: "command", transcript: "mark the milk one done",
      command: { action: "complete", candidates: [ { id: "t1", title: "Buy milk", confidence: "high" } ] } },
    "cmd-ambig": { intent: "command", transcript: "the dentist thing is sorted",
      command: { action: "complete", candidates: [
        { id: "t3", title: "Call the dentist", confidence: "low" },
        { id: "t4", title: "Reply to Sam about the trip", confidence: "low" } ] } },
    fail: { intent: "unknown", transcript: "", failed: true },
    unknown: { intent: "unknown", transcript: "hmm what was it again" },
  };

  let state = { variant: "A", todos: SEED(), pending: [] };
  let timers = [];
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const after = (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

  const $ = (s) => document.querySelector(s);
  const list = $("#list"), screen = $("#screen"), sheet = $("#sheet"),
        scrim = $("#scrim"), toast = $("#toast"), rec = $("#rec"),
        recTx = $("#rec-transcript"), recLabel = $("#rec-label");

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

  // waveform bars
  (() => { const w = $("#wave"); for (let i=0;i<7;i++){ const s=document.createElement("span"); s.style.animationDelay=(i*0.09)+"s"; w.appendChild(s);} })();

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function render() {
    const v = state.variant;
    // list
    list.className = "list " + (v === "C" ? "pad-composer" : "pad-fab");
    const open = state.todos.filter(t=>!t.done), done = state.todos.filter(t=>t.done);
    let html = "";
    // pending (variant C) at top
    if (v === "C" && state.pending.length) {
      state.pending.forEach(p => {
        html += `<div class="pending-note">◐ Draft — tap Keep, or auto-saves in a moment</div>`;
        html += `<div class="todo pending" data-pending="${p.id}">
            <div class="check"></div>
            <div class="body">
              <div class="title">${esc(p.title)}</div>
              ${p.due?`<div class="due">${esc(p.due)}</div>`:`<div class="due none">No date</div>`}
              <div class="pending-actions">
                <button class="keep" data-keep="${p.id}">Keep</button>
                <button data-edit="${p.id}">Edit</button>
                <button data-drop="${p.id}">Discard</button>
              </div>
            </div></div>`;
      });
    }
    if (!open.length && !done.length && !(v==="C"&&state.pending.length)) {
      html += `<div class="empty">Nothing yet. Tap the mic and say what you need to do.</div>`;
    }
    if (open.length) {
      html += `<div class="group-label">Open</div>`;
      open.forEach(t => html += todoRow(t));
    }
    if (done.length) {
      html += `<div class="group-label">Done</div>`;
      done.forEach(t => html += todoRow(t));
    }
    list.innerHTML = html;

    // mic / composer
    screen.querySelectorAll(".mic,.composer,.hero-hint").forEach(n=>n.remove());
    if (v === "A") {
      add(screen, `<button class="mic fab" id="mic" aria-label="Hold to capture">${MIC}</button>`);
    } else if (v === "B") {
      add(screen, `<div class="hero-hint">Tap, speak, it saves itself</div>
                   <button class="mic hero" id="mic" aria-label="Tap to capture">${MIC}</button>`);
    } else {
      add(screen, `<div class="composer">
          <div class="fake-input">Say a task, or complete one…</div>
          <button class="mic-sm" id="mic" aria-label="Tap to capture">${MIC}</button></div>`);
    }
    const mic = $("#mic");
    if (mic) mic.addEventListener("click", () => runCapture(state._lastSim || "capture"));

    // title/count
    $("#app-title").textContent = v === "B" ? "Capture" : "Today";
    $("#app-count").textContent = `${open.length} open · ${done.length} done`;

    // switcher label
    $("#v-label").innerHTML = `<b>${v}</b> — ${VARIANTS[v].name}`;
  }
  function add(parent, html){ const d=document.createElement("div"); d.innerHTML=html; while(d.firstChild) parent.appendChild(d.firstChild); }

  function todoRow(t){
    return `<div class="todo ${t.done?'done':''}" data-id="${t.id}">
      <div class="check" data-toggle="${t.id}">${t.done?CHECK:''}</div>
      <div class="body">
        <div class="title">${esc(t.title)}</div>
        ${t.due?`<div class="due">${esc(t.due)}</div>`:`<div class="due none">No date</div>`}
      </div></div>`;
  }

  // ---------- recording animation then dispatch ----------
  function runCapture(simKey){
    state._lastSim = simKey;
    const data = SIM[simKey];
    closeSheet(); hideToast();
    rec.classList.add("show");
    recLabel.textContent = "Listening…";
    recTx.textContent = "";
    const dur = reduce ? 250 : 1200;
    // fake live transcript reveal
    if (data.transcript && !reduce) {
      const words = data.transcript.split(" ");
      words.forEach((_,i) => after(300 + i*(dur-300)/words.length, () => {
        recTx.textContent = words.slice(0, i+1).join(" ");
      }));
    }
    after(dur, () => { recLabel.textContent = "Thinking…"; });
    after(dur + (reduce?150:450), () => { rec.classList.remove("show"); dispatch(data); });
  }

  function dispatch(data){
    if (data.failed) return onFail();
    if (data.intent === "unknown") return onUnknown(data);
    if (data.intent === "command") return onCommand(data);
    return onCapture(data); // capture — the branch the variants disagree on
  }

  // ---------- CAPTURE — variant-specific ----------
  function onCapture(data){
    const v = state.variant;
    if (v === "A") return captureConfirmSheet(data);
    if (v === "B") return captureAutoSave(data);
    return capturePending(data);
  }

  // Variant A: confirm sheet before anything is saved
  function captureConfirmSheet(data){
    const chips = data.captures.map(c =>
      `<div class="chip"><span class="dot"></span><span class="c-title">${esc(c.title)}</span>${c.due?`<span class="c-due">${esc(c.due)}</span>`:''}</div>`).join("");
    openSheet(`
      <div class="grabber"></div>
      <div class="heard">You said</div>
      <div class="heard-txt">"${esc(data.transcript)}"</div>
      <h2>${data.captures.length===1?"Add this task?":`Add these ${data.captures.length} tasks?`}</h2>
      ${chips}
      <div class="sheet-actions">
        <button class="btn danger-ghost" id="s-cancel">Discard</button>
        <button class="btn primary" id="s-save">Add ${data.captures.length===1?"task":"all"}</button>
      </div>`);
    $("#s-cancel").onclick = () => { closeSheet(); showToast("Discarded", null, false); };
    $("#s-save").onclick = () => {
      closeSheet();
      data.captures.forEach(c => addTodo(c));
      render(); markEnter();
      showToast(`Added ${data.captures.length} ${data.captures.length===1?'task':'tasks'}`, null, false);
    };
  }

  // Variant B: save immediately, offer undo
  function captureAutoSave(data){
    const added = data.captures.map(c => addTodo(c));
    render(); markEnter();
    showToast(`Added ${data.captures.length} ${data.captures.length===1?'task':'tasks'}`,
      { label: "Undo", fn: () => { state.todos = state.todos.filter(t => !added.includes(t.id)); render(); showToast("Removed", null, false); } },
      false, `"${data.transcript}"`);
  }

  // Variant C: land as pending draft, auto-confirm after a beat
  function capturePending(data){
    data.captures.forEach(c => {
      const p = { id: "p"+Math.floor(performance.now())+Math.random().toString(36).slice(2,5), ...c };
      state.pending.push(p);
      after(4200, () => keepPending(p.id)); // self-confirm
    });
    render();
    list.scrollTop = 0;
  }
  function keepPending(pid){
    const idx = state.pending.findIndex(p=>p.id===pid);
    if (idx<0) return;
    const p = state.pending.splice(idx,1)[0];
    addTodo(p); render(); markEnter();
  }
  function dropPending(pid){ state.pending = state.pending.filter(p=>p.id!==pid); render(); }

  // ---------- COMMAND — gated in EVERY variant (never auto-apply, per #2) ----------
  function onCommand(data){
    const cands = data.command.candidates;
    if (!cands.length) return showToast("Couldn't find that todo", null, true, `"${data.transcript}"`);
    const single = cands.length === 1 && cands[0].confidence === "high";
    if (single) {
      // path B — confirm sheet
      const c = cands[0];
      openSheet(`
        <div class="grabber"></div>
        <div class="heard">You said</div>
        <div class="heard-txt">"${esc(data.transcript)}"</div>
        <h2>Complete this?</h2>
        <div class="chip"><span class="dot" style="background:var(--done)"></span><span class="c-title">${esc(c.title)}</span></div>
        <div class="sheet-actions">
          <button class="btn" id="s-cancel">Not that</button>
          <button class="btn primary" id="s-do" style="background:var(--done);border-color:var(--done)">Mark done</button>
        </div>`);
      $("#s-cancel").onclick = closeSheet;
      $("#s-do").onclick = () => { closeSheet(); completeTodo(c.id); };
    } else {
      // path C — tap-list of candidates
      const rows = cands.map(c =>
        `<div class="cand" data-complete="${c.id}"><span class="c-title">${esc(c.title)}</span><span class="conf ${c.confidence}">${c.confidence}</span></div>`).join("");
      openSheet(`
        <div class="grabber"></div>
        <div class="heard">You said</div>
        <div class="heard-txt">"${esc(data.transcript)}"</div>
        <h2>Which one did you finish?</h2>
        ${rows}
        <div class="sheet-actions"><button class="btn" id="s-cancel">None of these</button></div>`);
      $("#s-cancel").onclick = closeSheet;
    }
  }
  function completeTodo(id){
    const t = state.todos.find(x=>x.id===id); if(!t) return;
    t.done = true; render();
    showToast(`Completed "${t.title}"`, { label:"Undo", fn:()=>{ t.done=false; render(); } }, false);
  }

  // ---------- failure surfaces ----------
  function onFail(){
    showToast("Didn't catch that", { label:"Retry", fn:()=>runCapture("capture") }, true, "Try again in a quieter spot");
  }
  function onUnknown(data){
    showToast("Not sure what you meant", { label:"Retry", fn:()=>runCapture("capture") }, true,
      data.transcript ? `Heard: "${data.transcript}"` : "Nothing recognized");
  }

  // ---------- primitives ----------
  function addTodo(c){ const id="t"+Math.floor(performance.now())+Math.random().toString(36).slice(2,4); state.todos.unshift({ id, title:c.title, due:c.due||null, done:false }); return id; }
  function markEnter(){ requestAnimationFrame(()=>list.querySelectorAll(".todo").forEach((n,i)=>{ if(i<3) n.classList.add("enter"); })); }

  function openSheet(html){ sheet.innerHTML = html; scrim.classList.add("show"); requestAnimationFrame(()=>sheet.classList.add("show")); }
  function closeSheet(){ sheet.classList.remove("show"); scrim.classList.remove("show"); }
  scrim.addEventListener("click", closeSheet);

  let toastTimer;
  function showToast(msg, action, warn, sub){
    clearTimeout(toastTimer);
    toast.className = "toast" + (warn ? " warn":"");
    toast.innerHTML = `<div class="t-msg">${esc(msg)}${sub?`<small>${esc(sub)}</small>`:""}</div>` +
      (action?`<button id="t-act">${esc(action.label)}</button>`:"");
    requestAnimationFrame(()=>toast.classList.add("show"));
    if (action) $("#t-act").onclick = () => { hideToast(); action.fn(); };
    toastTimer = setTimeout(hideToast, action ? 5200 : 2600);
  }
  function hideToast(){ toast.classList.remove("show"); }

  // ---------- list interactions ----------
  list.addEventListener("click", (e) => {
    const tog = e.target.closest("[data-toggle]");
    if (tog) { const t = state.todos.find(x=>x.id===tog.dataset.toggle); if(t){ t.done=!t.done; render(); } return; }
    const keep = e.target.closest("[data-keep]"); if (keep) return keepPending(keep.dataset.keep);
    const drop = e.target.closest("[data-drop]"); if (drop) return dropPending(drop.dataset.drop);
    const edit = e.target.closest("[data-edit]"); if (edit) return showToast("Edit sheet (stub)", null, false);
    const comp = e.target.closest("[data-complete]"); if (comp) { closeSheet(); completeTodo(comp.dataset.complete); }
  });
  sheet.addEventListener("click", (e) => {
    const comp = e.target.closest("[data-complete]"); if (comp) { closeSheet(); completeTodo(comp.dataset.complete); }
  });

  // ---------- variant switching ----------
  function setVariant(v, push){
    if (!VARIANTS[v]) v = "A";
    state = { variant: v, todos: SEED(), pending: [] };
    clearTimers(); closeSheet(); hideToast(); rec.classList.remove("show");
    render();
    if (push) { const u = new URL(location); u.searchParams.set("variant", v); history.replaceState({}, "", u); }
  }
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  function step(d){ const i = ORDER.indexOf(state.variant); setVariant(ORDER[(i+d+ORDER.length)%ORDER.length], true); }
  addEventListener("keydown", (e) => {
    const tag = (document.activeElement?.tagName||"").toLowerCase();
    if (tag==="input"||tag==="textarea"||document.activeElement?.isContentEditable) return;
    if (e.key==="ArrowLeft") step(-1);
    if (e.key==="ArrowRight") step(1);
  });

  // ---------- tray ----------
  document.querySelectorAll("[data-sim]").forEach(b => b.addEventListener("click", () => runCapture(b.dataset.sim)));
  $("#reset").onclick = () => setVariant(state.variant, false);

  // init
  const start = new URL(location).searchParams.get("variant");
  setVariant(ORDER.includes(start) ? start : "A", false);
})();
</script>
